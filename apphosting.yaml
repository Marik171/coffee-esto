# Firebase App Hosting runtime config
# https://firebase.google.com/docs/app-hosting/configure
#
# All vars need BUILD availability too: Next.js executes route modules
# while collecting page data during `next build`, and these are all read
# at module scope (not lazily inside handlers), so they must be present then.

env:
  # Plain (non-secret) runtime config
  - variable: ADMIN_EMAIL
    value: thecoffeeesto@gmail.com
    availability:
      - BUILD
      - RUNTIME

  - variable: OWNER_EMAIL
    value: thecoffeeesto@gmail.com
    availability:
      - BUILD
      - RUNTIME

  - variable: BREVO_SENDER_EMAIL
    value: no-reply@coffeeesto.com
    availability:
      - BUILD
      - RUNTIME

  - variable: BREVO_SENDER_NAME
    value: Coffee Esto
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_URL
    value: https://fdoukqqdqllistvqxvtu.supabase.co
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_STORAGE_BUCKET
    value: product-media
    availability:
      - BUILD
      - RUNTIME

  # iyzico live endpoint — real cards are charged against this
  - variable: IYZIPAY_BASE_URL
    value: https://api.iyzipay.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAZieMuFbJGcYfT4pcXcJkTNM6uDa9isww
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: coffee-esto-70690.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: coffee-esto-70690
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: coffee-esto-70690.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "610437324640"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:610437324640:web:82e78558a3643200270805"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-S08ZQD3FR0
    availability:
      - BUILD
      - RUNTIME

  # Secrets — values live in Secret Manager, set via `firebase apphosting:secrets:set`
  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - BUILD
      - RUNTIME

  - variable: ADMIN_PASSWORD
    secret: ADMIN_PASSWORD
    availability:
      - BUILD
      - RUNTIME

  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: DIRECT_URL
    secret: DIRECT_URL
    availability:
      - BUILD
      - RUNTIME

  - variable: IYZIPAY_API_KEY
    secret: IYZIPAY_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: IYZIPAY_SECRET_KEY
    secret: IYZIPAY_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: BREVO_API_KEY
    secret: BREVO_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - BUILD
      - RUNTIME
